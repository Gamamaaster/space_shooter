<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04081a;--blue:#7ecbff;--orange:#ff7e50;--gold:#ffc84a;--green:#50e3a4;--purple:#c07aff;--red:#ff4466;--text:#c8dff5;--text2:rgba(200,223,245,0.5);--border:rgba(126,203,255,0.18)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}
#bgCanvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity 0.35s ease}
.screen.active{opacity:1;pointer-events:all}
.corner{position:fixed;width:44px;height:44px;border-color:rgba(126,203,255,0.18);border-style:solid;pointer-events:none;z-index:5}
.corner-tl{top:12px;left:12px;border-width:1px 0 0 1px}.corner-tr{top:12px;right:12px;border-width:1px 1px 0 0}
.corner-bl{bottom:12px;left:12px;border-width:0 0 1px 1px}.corner-br{bottom:12px;right:12px;border-width:0 1px 1px 0}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:200}
.title-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(34px,7vw,68px);letter-spacing:.12em;color:var(--blue);text-shadow:0 0 40px rgba(126,203,255,.5),0 0 80px rgba(126,203,255,.18);animation:pulseGlow 3s ease-in-out infinite;margin-bottom:6px;text-align:center}
.title-sub{font-size:12px;letter-spacing:.3em;color:var(--text2);margin-bottom:40px;text-transform:uppercase}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 40px rgba(126,203,255,.5),0 0 80px rgba(126,203,255,.18)}50%{text-shadow:0 0 60px rgba(126,203,255,.85),0 0 120px rgba(126,203,255,.32)}}
.menu-btn{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--blue);background:transparent;border:1px solid var(--border);padding:13px 44px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;margin:5px 0;min-width:260px;text-transform:uppercase}
.menu-btn::before{content:'';position:absolute;inset:0;background:rgba(126,203,255,.06);transform:translateX(-101%);transition:transform .18s ease}
.menu-btn:hover::before{transform:translateX(0)}.menu-btn:hover{border-color:rgba(126,203,255,.5);color:#fff;box-shadow:0 0 20px rgba(126,203,255,.14)}.menu-btn:active{transform:scale(.98)}
.menu-btn.primary{border-color:rgba(126,203,255,.45);box-shadow:0 0 16px rgba(126,203,255,.09)}
.screen-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;letter-spacing:.15em;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
.back-btn{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.15em;color:var(--text2);background:transparent;border:none;cursor:pointer;padding:8px 16px;transition:color .18s;text-transform:uppercase;margin-top:8px}
.back-btn:hover{color:var(--blue)}
/* AUTH */
#authScreen{gap:10px}
.auth-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border)}
.auth-tab{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.12em;padding:10px 32px;cursor:pointer;background:transparent;border:none;color:var(--text2);transition:all .18s;text-transform:uppercase}
.auth-tab.active{background:rgba(126,203,255,.1);color:var(--blue)}
.auth-form{display:flex;flex-direction:column;gap:10px;width:300px}
.auth-input{background:rgba(7,14,35,.9);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;padding:12px 16px;outline:none;transition:border-color .18s;width:100%}
.auth-input:focus{border-color:rgba(126,203,255,.5)}.auth-input::placeholder{color:var(--text2)}
.auth-msg{font-size:12px;text-align:center;min-height:18px;letter-spacing:.05em}.auth-msg.error{color:#ff4466}.auth-msg.ok{color:var(--green)}
.user-badge{font-size:12px;color:var(--text2);letter-spacing:.08em;margin-bottom:30px;display:flex;align-items:center;gap:8px}
.user-badge span{color:var(--blue)}.logout-link{font-size:11px;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--border);transition:color .15s}.logout-link:hover{color:#ff4466}
/* LEVELS */
#levelScreen{gap:20px}
.levels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;width:92%}
.level-card{background:rgba(7,14,35,.8);border:1px solid var(--border);padding:16px 12px;cursor:pointer;transition:all .18s;text-align:center;position:relative;overflow:hidden}
.level-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent,var(--blue));transform:scaleX(0);transition:transform .18s}
.level-card:hover::after{transform:scaleX(1)}.level-card:hover{border-color:rgba(126,203,255,.35);background:rgba(126,203,255,.05);transform:translateY(-2px)}
.level-num{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--accent,var(--blue));line-height:1;margin-bottom:4px}
.level-name{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--text2);text-transform:uppercase;margin-bottom:6px}
.level-stars{font-size:12px;margin-bottom:5px;letter-spacing:2px}.level-desc{font-size:10px;color:var(--text2);line-height:1.45}
.level-tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;letter-spacing:.08em;padding:2px 6px;border:1px solid;border-radius:2px;text-transform:uppercase}
/* LB */
#lbScreen{gap:16px}
.lb-tabs{display:flex;gap:0;border:1px solid var(--border);margin-bottom:4px;flex-wrap:wrap}
.lb-tab{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.1em;padding:8px 16px;cursor:pointer;background:transparent;border:none;color:var(--text2);transition:all .18s;text-transform:uppercase}
.lb-tab.active{background:rgba(126,203,255,.1);color:var(--blue)}
.lb-table{width:480px;max-width:92vw;border-collapse:collapse}
.lb-table th{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.15em;color:var(--text2);text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}
.lb-table td{padding:8px 12px;font-size:13px;border-bottom:1px solid rgba(126,203,255,.06)}
.lb-table tr.me td{color:var(--gold);background:rgba(255,200,74,.05)}.lb-table tr:hover td{background:rgba(126,203,255,.04)}
.rank-1{color:var(--gold)}.rank-2{color:#c0c0c0}.rank-3{color:#cd7f32}.lb-loading{font-size:12px;color:var(--text2);letter-spacing:.1em;padding:24px;text-align:center}
/* GAME */
#gameScreen{justify-content:flex-start;padding:0}
#gameHUD{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:rgba(4,8,26,.94);border-bottom:1px solid var(--border);z-index:20;flex-shrink:0;gap:8px}
.hud-block{display:flex;flex-direction:column;align-items:center;gap:1px}
.hud-label{font-size:7px;letter-spacing:.22em;color:var(--text2);text-transform:uppercase}
.hud-value{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:var(--blue);line-height:1}
.hud-lives{font-size:14px;letter-spacing:2px}
.shield-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.shield-bar{width:80px;height:4px;background:rgba(126,203,255,.15);border-radius:2px;overflow:hidden}
.shield-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.wave-banner{position:fixed;top:60px;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:var(--gold);letter-spacing:.15em;z-index:30;opacity:0;text-transform:uppercase;text-shadow:0 0 20px rgba(255,200,74,.5);pointer-events:none;transition:opacity .4s}
#gameCanvas{display:block;flex:1;width:100%;cursor:none}
#gameOverlay{position:fixed;inset:0;background:rgba(4,8,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:14px;opacity:0;pointer-events:none;transition:opacity .28s}
#gameOverlay.visible{opacity:1;pointer-events:all}
.overlay-title{font-family:'Orbitron',sans-serif;font-size:clamp(26px,5vw,46px);font-weight:900;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}
.overlay-title.danger{color:var(--orange)}.overlay-sub{font-size:12px;color:var(--text2);letter-spacing:.1em;margin-top:-6px}
.overlay-score{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:700;color:var(--gold)}.overlay-row{display:flex;gap:10px;margin-top:6px}
.controls-bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text2);letter-spacing:.1em;z-index:20;pointer-events:none;white-space:nowrap}
.howto-row{display:flex;justify-content:space-between;padding:11px 16px;border:1px solid var(--border);background:rgba(7,14,35,.8);width:360px;max-width:90vw;margin-bottom:8px}
@media(max-width:600px){.levels-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="corner corner-tl"></div><div class="corner corner-tr"></div>
<div class="corner corner-bl"></div><div class="corner corner-br"></div>
<div class="wave-banner" id="waveBanner"></div>

<!-- TITLE -->
<div id="titleScreen" class="screen active">
  <div class="title-logo">SPACE<br>SHOOTER</div>
  <div class="title-sub">Édition Galactique</div>
  <div id="titleUserBadge" class="user-badge" style="display:none">Connecté : <span id="titleUsername"></span><span class="logout-link" onclick="logout()">déconnexion</span></div>
  <button class="menu-btn primary" onclick="goPlay()">▶ Jouer</button>
  <button class="menu-btn" id="authNavBtn" onclick="showScreen('authScreen')">👤 Connexion / Inscription</button>
  <button class="menu-btn" onclick="openLeaderboard()">🏆 Classement</button>
  <button class="menu-btn" onclick="showScreen('howtoScreen')">? Contrôles</button>
  <div style="margin-top:32px;font-size:11px;color:var(--text2)">Best local : <span style="color:var(--gold)" id="hiScoreDisplay">0</span></div>
</div>

<!-- AUTH -->
<div id="authScreen" class="screen">
  <div class="screen-title" style="margin-bottom:20px">Compte</div>
  <div class="auth-tabs"><button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Connexion</button><button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Inscription</button></div>
  <div class="auth-form">
    <input class="auth-input" id="authUser" placeholder="Pseudo" maxlength="20" autocomplete="off">
    <input class="auth-input" id="authPass" type="password" placeholder="Mot de passe" maxlength="40">
    <div id="authConfirmWrap" style="display:none"><input class="auth-input" id="authPassConfirm" type="password" placeholder="Confirmer le mot de passe"></div>
    <button class="menu-btn primary" id="authSubmitBtn" onclick="submitAuth()">Se connecter</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
  <button class="back-btn" onclick="showScreen('titleScreen')">← Retour</button>
</div>

<!-- LEVELS -->
<div id="levelScreen" class="screen">
  <div class="screen-title">Sélectionner un niveau</div>
  <div class="levels-grid" id="levelsGrid"></div>
  <button class="back-btn" onclick="showScreen('titleScreen')">← Retour</button>
</div>

<!-- LEADERBOARD -->
<div id="lbScreen" class="screen">
  <div class="screen-title">Classement Global</div>
  <div class="lb-tabs" id="lbTabs"></div>
  <div id="lbContent" class="lb-loading">Chargement…</div>
  <button class="back-btn" onclick="showScreen('titleScreen')">← Retour</button>
</div>

<!-- HOWTO -->
<div id="howtoScreen" class="screen" style="gap:0">
  <div class="screen-title" style="margin-bottom:20px">Contrôles</div>
  <div class="howto-row"><span style="color:var(--text2);font-size:13px">Déplacer</span><span style="color:var(--blue);font-size:13px">← →</span></div>
  <div class="howto-row"><span style="color:var(--text2);font-size:13px">Tirer</span><span style="color:var(--blue);font-size:13px">Espace</span></div>
  <div class="howto-row"><span style="color:var(--text2);font-size:13px">Pause</span><span style="color:var(--blue);font-size:13px">P / Échap</span></div>
  <div class="howto-row"><span style="color:var(--text2);font-size:13px">Mobile</span><span style="color:var(--blue);font-size:13px">← ●  →</span></div>
  <button class="back-btn" onclick="showScreen('titleScreen')">← Retour</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div id="gameHUD">
    <div class="hud-block"><div class="hud-label">Score</div><div class="hud-value" id="scoreEl">0</div></div>
    <div class="hud-block"><div class="hud-label">Vague</div><div class="hud-value" id="waveEl">1</div></div>
    <div class="hud-block"><div class="hud-label">Niveau</div><div class="hud-value" id="levelEl" style="font-size:12px;color:var(--text2)">-</div></div>
    <div class="hud-block"><div class="hud-label">Vies</div><div class="hud-lives" id="livesEl">❤❤❤</div></div>
    <div class="shield-bar-wrap" id="shieldWrap" style="display:none"><div class="hud-label">Bouclier</div><div class="shield-bar"><div class="shield-bar-fill" id="shieldBar" style="width:100%"></div></div></div>
    <div class="hud-block"><div class="hud-label">Best</div><div class="hud-value" id="bestEl" style="font-size:12px;color:var(--gold)">0</div></div>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<div id="gameOverlay">
  <div class="overlay-title" id="overlayTitle">PAUSE</div>
  <div class="overlay-sub" id="overlaySub"></div>
  <div class="overlay-score" id="overlayScore" style="display:none"></div>
  <div id="overlayRank" style="font-size:13px;color:var(--text2);display:none"></div>
  <div class="overlay-row" id="overlayBtns"></div>
</div>
<div class="controls-bar" id="controlsBar" style="display:none">← → piloter &nbsp;·&nbsp; Espace tirer &nbsp;·&nbsp; P pause</div>

<script>
// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
async function dbGet(k){try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null}catch(e){return null}}
async function dbSet(k,v){try{await window.storage.set(k,JSON.stringify(v),true)}catch(e){}}
function getSession(){try{return JSON.parse(localStorage.getItem('ss_session')||'null')}catch(e){return null}}
function setSession(u){try{localStorage.setItem('ss_session',JSON.stringify(u))}catch(e){}}
function clearSession(){try{localStorage.removeItem('ss_session')}catch(e){}}
let currentUser=getSession();
async function hashPw(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
let authMode='login';
function switchTab(m){authMode=m;document.getElementById('tabLogin').classList.toggle('active',m==='login');document.getElementById('tabRegister').classList.toggle('active',m==='register');document.getElementById('authConfirmWrap').style.display=m==='register'?'block':'none';document.getElementById('authSubmitBtn').textContent=m==='login'?'Se connecter':'Créer le compte';document.getElementById('authMsg').textContent=''}
function setMsg(t,c){const e=document.getElementById('authMsg');e.textContent=t;e.className='auth-msg '+(c||'')}
async function submitAuth(){
  const user=document.getElementById('authUser').value.trim();
  const pass=document.getElementById('authPass').value;
  if(!user||!pass){setMsg('Remplis tous les champs','error');return}
  if(user.length<3){setMsg('Pseudo trop court (3 min)','error');return}
  setMsg('…');
  const users=(await dbGet('ss_users'))||{};
  const hash=await hashPw(pass);
  if(authMode==='login'){
    if(!users[user]){setMsg('Pseudo introuvable','error');return}
    if(users[user].pw!==hash){setMsg('Mot de passe incorrect','error');return}
    currentUser=user;setSession(user);setMsg('Connecté !','ok');setTimeout(()=>{updateTitleUser();showScreen('titleScreen')},600)
  } else {
    const c=document.getElementById('authPassConfirm').value;
    if(pass!==c){setMsg('Mots de passe différents','error');return}
    if(users[user]){setMsg('Pseudo déjà pris','error');return}
    users[user]={pw:hash,createdAt:Date.now()};await dbSet('ss_users',users);
    currentUser=user;setSession(user);setMsg('Compte créé !','ok');setTimeout(()=>{updateTitleUser();showScreen('titleScreen')},600)
  }
}
function logout(){currentUser=null;clearSession();updateTitleUser()}
function updateTitleUser(){
  const badge=document.getElementById('titleUserBadge');const btn=document.getElementById('authNavBtn');
  if(currentUser){badge.style.display='flex';document.getElementById('titleUsername').textContent=currentUser;btn.style.display='none'}
  else{badge.style.display='none';btn.style.display='block'}
  refreshHiScore()
}

// ═══════════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════════
let lbLevelId=1;
async function openLeaderboard(){showScreen('lbScreen');buildLbTabs();await loadLeaderboard(lbLevelId)}
function buildLbTabs(){const c=document.getElementById('lbTabs');c.innerHTML='';LEVELS.forEach(l=>{const b=document.createElement('button');b.className='lb-tab'+(l.id===lbLevelId?' active':'');b.textContent=l.name;b.onclick=async()=>{lbLevelId=l.id;buildLbTabs();await loadLeaderboard(l.id)};c.appendChild(b)})}
async function loadLeaderboard(lid){
  const c=document.getElementById('lbContent');c.innerHTML='<div class="lb-loading">Chargement…</div>';
  const all=(await dbGet('ss_scores'))||{};
  const entries=Object.entries(all).filter(([,v])=>v[lid]).map(([n,v])=>({name:n,score:v[lid]})).sort((a,b)=>b.score-a.score).slice(0,20);
  if(!entries.length){c.innerHTML='<div class="lb-loading">Aucun score pour ce niveau</div>';return}
  let h=`<table class="lb-table"><thead><tr><th>#</th><th>Joueur</th><th>Score</th></tr></thead><tbody>`;
  entries.forEach((e,i)=>{const me=currentUser&&e.name===currentUser;const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';h+=`<tr class="${me?'me':''}">`+`<td class="${rc}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>`+`<td style="${me?'color:var(--gold)':''}">${e.name}${me?' ◀':''}</td>`+`<td style="color:var(--blue);font-family:'Orbitron',sans-serif;font-size:14px">${e.score}</td></tr>`});
  c.innerHTML=h+`</tbody></table>`
}
async function submitScore(lid,score){
  if(!currentUser)return null;
  const all=(await dbGet('ss_scores'))||{};
  if(!all[currentUser])all[currentUser]={};
  const prev=all[currentUser][lid]||0;
  if(score>prev){all[currentUser][lid]=score;await dbSet('ss_scores',all)}
  const entries=Object.entries((await dbGet('ss_scores'))||{}).filter(([,v])=>v[lid]).map(([n,v])=>({name:n,score:v[lid]})).sort((a,b)=>b.score-a.score);
  return{rank:entries.findIndex(e=>e.name===currentUser)+1,total:entries.length}
}

// ═══════════════════════════════════════════════
// BG STARS
// ═══════════════════════════════════════════════
const bgC=document.getElementById('bgCanvas');const bgX=bgC.getContext('2d');let bgStars=[];
function initBg(){bgC.width=innerWidth;bgC.height=innerHeight;bgStars=[];for(let i=0;i<220;i++)bgStars.push({x:Math.random()*bgC.width,y:Math.random()*bgC.height,r:Math.random()*1.6+.2,s:Math.random()*.5+.1,o:Math.random()*.6+.15})}
function drawBg(){bgX.clearRect(0,0,bgC.width,bgC.height);for(let s of bgStars){bgX.globalAlpha=s.o;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,Math.PI*2);bgX.fill();s.y+=s.s;if(s.y>bgC.height)s.y=-2}bgX.globalAlpha=1;requestAnimationFrame(drawBg)}
initBg();drawBg();window.addEventListener('resize',initBg);

// ═══════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('controlsBar').style.display=id==='gameScreen'?'block':'none'}
function goPlay(){buildLevelCards();showScreen('levelScreen')}
function refreshHiScore(){const save=loadSave();const best=Object.values(save).reduce((m,v)=>Math.max(m,v.best||0),0);document.getElementById('hiScoreDisplay').textContent=best}
function loadSave(){try{return JSON.parse(localStorage.getItem('spaceshooter_save')||'{}')}catch(e){return{}}}
function writeSave(d){try{localStorage.setItem('spaceshooter_save',JSON.stringify(d))}catch(e){}}

// ═══════════════════════════════════════════════
// LEVEL DEFINITIONS
// Each level: waves = array of wave configs
// Wave: {duration, asteroids:{rate,size,speed,hp,split}, enemies:{rate,type}, mines, laser, nebula}
// ═══════════════════════════════════════════════
const LEVELS=[
{id:1,name:'Débris',accent:'#7ecbff',scoreGoal:400,lives:3,shield:0,bgC:'#04081a',
 desc:'Astéroïdes simples, vitesse faible',tags:[{l:'Astéroïdes',c:'#7ecbff'}],
 waves:[
  {dur:30000,ast:{rate:2200,sMin:16,sMax:38,vMin:.5,vMax:1.2,hp:1,split:false},enemies:null,mines:false,laser:false},

function buildLevelCards(){
  const grid=document.getElementById('levelsGrid');const save=loadSave();grid.innerHTML='';
  LEVELS.forEach(lvl=>{
    const card=document.createElement('div');card.className='level-card';card.style.setProperty('--accent',lvl.accent);
    const best=save[lvl.id]?.best||0;const stars=best>=lvl.scoreGoal?3:best>=lvl.scoreGoal*.6?2:best>0?1:0;
    const tagsHtml=(lvl.tags||[]).map(t=>`<span class="tag" style="color:${t.c};border-color:${t.c}40">${t.l}</span>`).join('');
    card.innerHTML=`<div class="level-num">${String(lvl.id).padStart(2,'0')}</div><div class="level-name">${lvl.name}</div>`+
      `<div class="level-stars" style="color:${lvl.accent}">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div>`+
      `<div class="level-desc">${lvl.desc}</div>`+
      `<div class="level-tags">${tagsHtml}</div>`+
      `${best>0?`<div style="font-size:10px;color:var(--text2);margin-top:5px">Best: <span style="color:${lvl.accent}">${best}</span></div>`:''}`;
    card.onclick=()=>startLevel(lvl);
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');
let W,H;
function resizeCanvas(){const hud=document.getElementById('gameHUD');W=innerWidth;H=innerHeight-hud.offsetHeight;canvas.width=W;canvas.height=H}

let gameState,score,lives,waveIndex,waveTimer,totalWaveTime;
let asteroids,bullets,enemyBullets,enemies,mines,particles,exhaust,laserBeams;
let ship,spawnTimer,enemySpawnTimer,mineSpawnTimer,laserTimer;
let lastTime,keys,touchLeft,touchRight,touchFire;
let currentLevelDef,currentWaveDef,animId;
let shield,maxShield;
const R=()=>Math.random();
function rand(a,b){return R()*(b-a)+a}

function startLevel(lvlDef){currentLevelDef=lvlDef;showScreen('gameScreen');setTimeout(()=>{resizeCanvas();initGame()},50)}

function initGame(){
  score=0;waveIndex=0;
  lives=currentLevelDef.lives;
  maxShield=currentLevelDef.shield||0;shield=maxShield;
  asteroids=[];bullets=[];enemyBullets=[];enemies=[];mines=[];particles=[];exhaust=[];laserBeams=[];
  spawnTimer=0;enemySpawnTimer=0;mineSpawnTimer=0;laserTimer=0;
  waveTimer=0;
  keys={left:false,right:false,fire:false};
  touchLeft=touchRight=touchFire=false;
  ship={x:W/2,y:H-90,vx:0,speed:4.8,invincible:0,shootCooldown:0,thrustAnim:0,tiltAngle:0};
  currentWaveDef=currentLevelDef.waves[0];
  gameState='playing';
  updateHUD();hideOverlay();
  document.getElementById('shieldWrap').style.display=maxShield>0?'flex':'none';
  const save=loadSave();document.getElementById('bestEl').textContent=save[currentLevelDef.id]?.best||0;
  document.getElementById('levelEl').textContent=currentLevelDef.name;
  showWaveBanner('Vague 1');
  if(animId)cancelAnimationFrame(animId);
  lastTime=0;animId=requestAnimationFrame(loop)
}

function showWaveBanner(txt){
  const b=document.getElementById('waveBanner');b.textContent=txt;b.style.opacity='1';
  setTimeout(()=>b.style.opacity='0',2200)
}

function updateHUD(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('waveEl').textContent=waveIndex+1;
  document.getElementById('livesEl').textContent='❤'.repeat(Math.max(0,lives));
  if(maxShield>0)document.getElementById('shieldBar').style.width=Math.round(shield/maxShield*100)+'%'
}

// ── ASTEROID SPAWN ──
function spawnAsteroid(wx,wy,sz,hp,forced){
  const w=currentWaveDef.ast;
  const size=sz||rand(w.sMin,w.sMax);
  const x=wx!==undefined?wx:rand(size,W-size);
  const y=wy!==undefined?wy:-size;
  const vx=rand(-1.8,1.8)*(1+waveIndex*.12);
  const vy=rand(w.vMin,w.vMax)*(1+waveIndex*.1);
  const hp2=hp||w.hp;
  const maxHp=hp2;
  // Generate irregular shape with cracks/surface
  const pts=[];const n=Math.floor(rand(9,16));
  for(let i=0;i<n;i++){
    const a=((Math.PI*2)/n)*i+rand(-.25,.25);
    const r=size*(.62+rand(0,.48));
    pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r})
  }
  // craters
  const craters=[];const nc=Math.floor(rand(1,4));
  for(let i=0;i<nc;i++) craters.push({x:rand(-size*.4,size*.4),y:rand(-size*.4,size*.4),r:rand(size*.08,size*.22)});
  // color based on level & size
  const palette=[
    ['#4a3d2e','#5a4a38','#3a2e20'],
    ['#3a4a2e','#4a5a38','#2e3a20'],
    ['#4a3a1a','#5a4a20','#3a2c10'],
    ['#4a2a18','#5a3420','#3a1e0e'],
    ['#2e2050','#3a2a68','#20163a'],
    ['#501414','#681818','#3a0e0e']
  ][Math.min(currentLevelDef.id-1,5)];
  asteroids.push({x,y,vx,vy,size,pts,craters,rot:0,rotV:rand(-.05,.05),hp:hp2,maxHp,split:w.split&&!forced,color:palette[0],stroke:palette[1],highlight:palette[2]+'80'})
}

// ── ENEMY SPAWN ──
function spawnEnemy(type){
  const x=rand(30,W-30);
  let e={x,y:-30,vx:rand(-.5,.5),vy:rand(.5,1.2),type,hp:type==='hunter'?3:type==='gunship'?2:1,maxHp:type==='hunter'?3:type==='gunship'?2:1,shootTimer:rand(1000,3000),rot:0};
  if(type==='hunter'){e.vy=rand(.8,1.5);e.trackSpeed=.02}
  enemies.push(e)
}

// ── MINE SPAWN ──
function spawnMine(){
  mines.push({x:rand(30,W-30),y:-20,vy:rand(.3,.8),armed:false,armTimer:2000,r:12,blink:0})
}

// ── UPDATE ──
function update(dt){
  if(gameState!=='playing')return;
  waveTimer+=dt;
  // wave transition
  const wv=currentLevelDef.waves;
  if(waveIndex<wv.length-1&&waveTimer>wv[waveIndex].dur){
    waveIndex++;currentWaveDef=wv[waveIndex];
    spawnTimer=0;enemySpawnTimer=0;mineSpawnTimer=0;laserTimer=0;
    showWaveBanner('Vague '+(waveIndex+1));updateHUD()
  }
  const w=currentWaveDef;
  ship.shootCooldown=Math.max(0,ship.shootCooldown-dt);
  ship.invincible=Math.max(0,ship.invincible-dt);
  ship.thrustAnim+=dt*.012;
  const left=keys.left||touchLeft;const right=keys.right||touchRight;const fire=keys.fire||touchFire;
  if(left){ship.vx=Math.max(ship.vx-.9,-ship.speed);ship.tiltAngle=Math.max(ship.tiltAngle-.04,-.38)}
  else if(right){ship.vx=Math.min(ship.vx+.9,ship.speed);ship.tiltAngle=Math.min(ship.tiltAngle+.04,.38)}
  else{ship.vx*=.82;ship.tiltAngle*=.88}
  ship.x=Math.max(24,Math.min(W-24,ship.x+ship.vx));
  if(fire&&ship.shootCooldown<=0){
    bullets.push({x:ship.x-9,y:ship.y-26,vy:-12,owner:'player'});
    bullets.push({x:ship.x+9,y:ship.y-26,vy:-12,owner:'player'});
    ship.shootCooldown=170;
    emitP(ship.x,ship.y-30,currentLevelDef.accent,4)
  }
  if(R()<.75)exhaust.push({x:ship.x+rand(-7,7),y:ship.y+24,vx:rand(-.6,.6),vy:rand(1.2,3.5),life:rand(12,32),maxLife:32,sz:rand(2,5)});
  for(let e of exhaust){e.x+=e.vx;e.y+=e.vy;e.life--}
  exhaust=exhaust.filter(e=>e.life>0);
  for(let b of bullets)b.y+=b.vy;
  bullets=bullets.filter(b=>b.y>-14&&b.y<H+14&&b.x>-10&&b.x<W+10);
  // asteroid spawn
  spawnTimer+=dt;
  if(spawnTimer>w.ast.rate){spawnTimer=0;spawnAsteroid();if(R()<.25+waveIndex*.08)spawnAsteroid();if(R()<.1+waveIndex*.05)spawnAsteroid()}
  for(let a of asteroids){a.x+=a.vx;a.y+=a.vy;a.rot+=a.rotV;if(a.x<-a.size||a.x>W+a.size)a.vx*=-1}
  // enemy spawn
  if(w.enemies){
    enemySpawnTimer+=dt;
    if(enemySpawnTimer>w.enemies.rate){enemySpawnTimer=0;spawnEnemy(w.enemies.type);if(R()<.3)spawnEnemy(w.enemies.type)}
  }
  for(let e of enemies){
    e.x+=e.vx; e.y+=e.vy;
    if(e.type==='hunter'){// track player
      const dx=ship.x-e.x;e.vx+=dx*e.trackSpeed;e.vx=Math.max(-2.5,Math.min(2.5,e.vx))}
    if(e.x<20||e.x>W-20)e.vx*=-1;
    e.shootTimer-=dt;
    if(e.shootTimer<=0){
      e.shootTimer=e.type==='hunter'?1500:e.type==='gunship'?2200:3500;
      shootEnemy(e)
    }
    e.rot+=.02
  }
  enemies=enemies.filter(e=>e.y<H+60&&e.hp>0);
  // mine spawn
  if(w.mines){mineSpawnTimer+=dt;if(mineSpawnTimer>w.mineRate){mineSpawnTimer=0;spawnMine()}}
  for(let m of mines){
    m.y+=m.vy;m.blink+=dt*.006;
    if(!m.armed){m.armTimer-=dt;if(m.armTimer<=0)m.armed=true}
    if(m.armed){// proximity detect
      const dx=ship.x-m.x;const dy=ship.y-m.y;
      if(Math.sqrt(dx*dx+dy*dy)<70){m.vy+=.05;// chase slowly
        m.x+=dx*.008}
    }
  }
  mines=mines.filter(m=>m.y<H+40);
  // laser beams
  if(w.laser){
    laserTimer-=dt;
    if(laserTimer<=0){laserTimer=rand(4000,8000);laserBeams.push({x:rand(W*.1,W*.9),life:3000,maxLife:3000,warn:1000})}
  }
  for(let l of laserBeams){l.life-=dt;l.warn-=dt}
  laserBeams=laserBeams.filter(l=>l.life>0);
  // enemy bullets
  for(let b of enemyBullets){b.x+=b.vx;b.y+=b.vy}
  enemyBullets=enemyBullets.filter(b=>b.y<H+10&&b.y>-10&&b.x>-10&&b.x<W+10);
  // PLAYER bullets vs asteroids
  for(let b of bullets){
    for(let a of asteroids){
      if(b.dead)continue;
      const dx=b.x-a.x;const dy=b.y-a.y;
      if(dx*dx+dy*dy<a.size*a.size){
        b.dead=true;a.hp--;emitP(b.x,b.y,currentLevelDef.accent,7);
        if(a.hp<=0){
          emitExplosion(a.x,a.y,a.size,currentLevelDef.accent);
          score+=a.size>32?25:12;
          if(a.split&&a.size>24){spawnAsteroid(a.x,a.y,a.size*.55,1,true);spawnAsteroid(a.x,a.y,a.size*.55,1,true)}
          updateHUD();a.dead=true
        }
      }
    }
  }
  // PLAYER bullets vs enemies
  for(let b of bullets){
    for(let e of enemies){
      if(b.dead)continue;
      const dx=b.x-e.x;const dy=b.y-e.y;
      if(dx*dx+dy*dy<22*22){b.dead=true;e.hp--;emitP(b.x,b.y,currentLevelDef.accent,8);
        if(e.hp<=0){emitExplosion(e.x,e.y,24,currentLevelDef.accent);score+=e.type==='hunter'?50:e.type==='gunship'?35:20;updateHUD()}}
    }
  }
  // PLAYER bullets vs mines
  for(let b of bullets){
    for(let m of mines){
      if(b.dead)continue;
      const dx=b.x-m.x;const dy=b.y-m.y;
      if(dx*dx+dy*dy<m.r*m.r){b.dead=true;emitExplosion(m.x,m.y,30,'#ff7e50');score+=15;updateHUD();m.dead=true}
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  asteroids=asteroids.filter(a=>!a.dead&&a.y<H+80);
  mines=mines.filter(m=>!m.dead);
  // ENEMY hits player
  if(ship.invincible<=0){
    // asteroids
    for(let a of asteroids){
      const dx=ship.x-a.x;const dy=ship.y-a.y;
      if(dx*dx+dy*dy<(a.size+14)*(a.size+14)){hitPlayer(25);break}
    }
    // enemy bullets
    for(let b of enemyBullets){
      if(b.dead)continue;
      const dx=ship.x-b.x;const dy=ship.y-b.y;
      if(dx*dx+dy*dy<16*16){b.dead=true;hitPlayer(20)}
    }
    enemyBullets=enemyBullets.filter(b=>!b.dead);
    // mines explosion
    for(let m of mines){
      if(!m.armed)continue;
      const dx=ship.x-m.x;const dy=ship.y-m.y;
      if(dx*dx+dy*dy<(m.r+14)*(m.r+14)){emitExplosion(m.x,m.y,40,'#ff7e50');m.dead=true;hitPlayer(40)}
    }
    mines=mines.filter(m=>!m.dead);
    // laser
    for(let l of laserBeams){
      if(l.warn>0)continue;
      if(Math.abs(ship.x-l.x)<18){hitPlayer(30);break}
    }
    // enemy collision
    for(let e of enemies){
      const dx=ship.x-e.x;const dy=ship.y-e.y;
      if(dx*dx+dy*dy<24*24){hitPlayer(35);e.hp=0}
    }
  }
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--}
  particles=particles.filter(p=>p.life>0)
}

function hitPlayer(dmg){
  if(maxShield>0&&shield>0){
    shield=Math.max(0,shield-dmg);updateHUD();
    emitP(ship.x,ship.y,'#7ecbff',12);ship.invincible=800;return
  }
  lives--;updateHUD();emitExplosion(ship.x,ship.y,20,'#ff4466');ship.invincible=2800;
  if(lives<=0)endGame()
}

function shootEnemy(e){
  const dx=ship.x-e.x;const dy=ship.y-e.y;const d=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=e.type==='hunter'?4.5:3.5;
  const spread=e.type==='gunship'?.15:0;
  if(e.type==='gunship'){// triple shot
    [-spread,0,spread].forEach(off=>{const a=Math.atan2(dy,dx)+off;enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,type:e.type})})
  } else {
    enemyBullets.push({x:e.x,y:e.y,vx:(dx/d)*spd,vy:(dy/d)*spd,type:e.type})
  }
}

function emitP(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:rand(20,55),maxLife:55,color,r:rand(1.5,3)})}
function emitExplosion(x,y,sz,color){
  for(let i=0;i<22;i++)particles.push({x,y,vx:rand(-sz*.12,sz*.12),vy:rand(-sz*.12,sz*.12),life:rand(30,80),maxLife:80,color,r:rand(2,5)});
  for(let i=0;i<8;i++)particles.push({x,y,vx:rand(-2,2),vy:rand(-2,2),life:rand(15,40),maxLife:40,color:'#fff',r:rand(1,3)})
}

// ═══════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════
function draw(){
  ctx.fillStyle=currentLevelDef.bgC;ctx.fillRect(0,0,W,H);
  // exhaust
  for(let e of exhaust){
    const t=e.life/e.maxLife;ctx.globalAlpha=t*.65;
    const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.sz);
    g.addColorStop(0,'rgba(255,160,60,.9)');g.addColorStop(.5,'rgba(255,80,20,.4)');g.addColorStop(1,'rgba(255,40,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.sz,0,Math.PI*2);ctx.fill()
  }
  ctx.globalAlpha=1;
  // LASER BEAMS
  for(let l of laserBeams){
    const warning=l.warn>0;const t=1-l.life/l.maxLife;
    ctx.save();
    if(warning){
      ctx.globalAlpha=.2+Math.sin(Date.now()*.02)*.15;
      ctx.strokeStyle='#ff4466';ctx.lineWidth=2;ctx.setLineDash([8,6]);
      ctx.beginPath();ctx.moveTo(l.x,0);ctx.lineTo(l.x,H);ctx.stroke();ctx.setLineDash([])
    } else {
      ctx.globalAlpha=.9*(1-Math.max(0,t-.7)/.3);
      const lg=ctx.createLinearGradient(l.x-14,0,l.x+14,0);
      lg.addColorStop(0,'rgba(255,68,102,0)');lg.addColorStop(.5,'rgba(255,68,102,.85)');lg.addColorStop(1,'rgba(255,68,102,0)');
      ctx.fillStyle=lg;ctx.fillRect(l.x-14,0,28,H);
      ctx.strokeStyle='rgba(255,200,200,.6)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(l.x,0);ctx.lineTo(l.x,H);ctx.stroke()
    }
    ctx.restore()
  }
  // MINES
  for(let m of mines){
    ctx.save();ctx.translate(m.x,m.y);
    const blink=Math.sin(m.blink)*m.armed?.5:.3;
    ctx.globalAlpha=.7+blink*.3;
    ctx.strokeStyle=m.armed?'#ff7e50':'#ffc84a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,m.r,0,Math.PI*2);ctx.stroke();
    // spikes
    for(let i=0;i<8;i++){const a=(Math.PI*2/8)*i;ctx.beginPath();ctx.moveTo(Math.cos(a)*m.r,Math.sin(a)*m.r);ctx.lineTo(Math.cos(a)*(m.r+5),Math.sin(a)*(m.r+5));ctx.stroke()}
    ctx.fillStyle=m.armed?'rgba(255,126,80,.3)':'rgba(255,200,74,.2)';ctx.beginPath();ctx.arc(0,0,m.r-2,0,Math.PI*2);ctx.fill();
    if(!m.armed){ctx.fillStyle='rgba(255,200,74,.8)';ctx.font='8px Share Tech Mono';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ARM',0,0)}
    ctx.restore()
  }
  // ENEMY BULLETS
  for(let b of enemyBullets){
    ctx.save();ctx.globalAlpha=.9;
    const clr=b.type==='hunter'?'#c07aff':'#ff7e50';
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,6);
    g.addColorStop(0,'#fff');g.addColorStop(.4,clr);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
    ctx.restore()
  }
  // ENEMIES
  for(let e of enemies)drawEnemy(e);
  // PLAYER BULLETS
  for(let b of bullets){
    ctx.save();
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,7);
    g.addColorStop(0,'#fff');g.addColorStop(.4,currentLevelDef.accent);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.35;ctx.strokeStyle=currentLevelDef.accent;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+16);ctx.stroke();
    ctx.restore()
  }
  // ASTEROIDS
  for(let a of asteroids)drawAsteroid(a);
  // PARTICLES
  for(let p of particles){ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  // PLAYER SHIP
  if(gameState==='playing'){
    const alpha=ship.invincible>0?(Math.sin(Date.now()*.018)>0?.28:1):1;
    drawShip(ship.x,ship.y,alpha,currentLevelDef.accent,ship.tiltAngle,ship.thrustAnim);
    // shield bubble
    if(maxShield>0&&shield>0){
      ctx.save();ctx.globalAlpha=.12*(shield/maxShield);
      const sg=ctx.createRadialGradient(ship.x,ship.y,10,ship.x,ship.y,42);
      sg.addColorStop(0,'rgba(126,203,255,0)');sg.addColorStop(.8,'rgba(126,203,255,.3)');sg.addColorStop(1,'rgba(126,203,255,.7)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(ship.x,ship.y,42,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.4*(shield/maxShield);ctx.strokeStyle='rgba(126,203,255,.8)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(ship.x,ship.y,42,0,Math.PI*2);ctx.stroke();ctx.restore()
    }
  }
}

// ── ASTEROID DRAW (detailed) ──
function drawAsteroid(a){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  // drop shadow / glow for large
  if(a.size>32){
    ctx.save();ctx.globalAlpha=.18;ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(a.pts[0].x,a.pts[0].y);for(let i=1;i<a.pts.length;i++)ctx.lineTo(a.pts[i].x,a.pts[i].y);ctx.closePath();
    ctx.fillStyle='#000';ctx.fill();ctx.restore()
  }
  // main body
  ctx.beginPath();ctx.moveTo(a.pts[0].x,a.pts[0].y);for(let i=1;i<a.pts.length;i++)ctx.lineTo(a.pts[i].x,a.pts[i].y);ctx.closePath();
  // radial gradient for 3D feel
  const rg=ctx.createRadialGradient(-a.size*.25,-a.size*.25,a.size*.05,0,0,a.size*.95);
  rg.addColorStop(0,lighten(a.color,40));rg.addColorStop(.4,a.color);rg.addColorStop(1,darken(a.color,25));
  ctx.fillStyle=rg;ctx.fill();
  // edge stroke
  ctx.strokeStyle=a.stroke;ctx.lineWidth=1.2;ctx.stroke();
  // highlight edge (top-left)
  ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(-a.size*.3,-a.size*.3,a.size*.8,Math.PI*1.0,Math.PI*1.6);ctx.stroke();
  ctx.restore();
  // craters
  for(let c of a.craters){
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    const cg=ctx.createRadialGradient(c.x-c.r*.3,c.y-c.r*.3,0,c.x,c.y,c.r);
    cg.addColorStop(0,darken(a.color,30));cg.addColorStop(.6,darken(a.color,15));cg.addColorStop(1,a.stroke);
    ctx.fillStyle=cg;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=.5;ctx.stroke()
  }
  // crack lines
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=.8;
  const cx1=rand(-a.size*.3,a.size*.3);const cy1=rand(-a.size*.3,a.size*.3);
  ctx.beginPath();ctx.moveTo(cx1,cy1);ctx.lineTo(cx1+rand(-a.size*.3,a.size*.3),cy1+rand(-a.size*.3,a.size*.3));ctx.stroke();
  // damage cracks (when hp reduced)
  if(a.hp<a.maxHp){
    ctx.strokeStyle='rgba(255,120,50,.55)';ctx.lineWidth=1.2;
    for(let i=0;i<3;i++){const ang=rand(0,Math.PI*2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*a.size*.7,Math.sin(ang)*a.size*.7);ctx.stroke()}
    // glow
    ctx.save();ctx.globalAlpha=.2;const dg=ctx.createRadialGradient(0,0,0,0,0,a.size);
    dg.addColorStop(0,'rgba(255,100,50,.8)');dg.addColorStop(1,'rgba(255,100,50,0)');
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(0,0,a.size,0,Math.PI*2);ctx.fill();ctx.restore()
  }
  // specular highlight dot
  ctx.beginPath();ctx.arc(-a.size*.28,-a.size*.28,a.size*.06,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
  ctx.restore()
}

function lighten(hex,amt){return shiftHex(hex,amt)}
function darken(hex,amt){return shiftHex(hex,-amt)}
function shiftHex(hex,amt){
  let r=parseInt(hex.slice(1,3),16)+amt;let g=parseInt(hex.slice(3,5),16)+amt;let b=parseInt(hex.slice(5,7),16)+amt;
  r=Math.min(255,Math.max(0,r));g=Math.min(255,Math.max(0,g));b=Math.min(255,Math.max(0,b));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`
}

// ── ENEMY DRAW ──
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  const alive=e.hp/e.maxHp;
  if(e.type==='scout'){
    // small triangular scout
    ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(14,-10);ctx.lineTo(0,-6);ctx.lineTo(-14,-10);ctx.closePath();
    ctx.fillStyle=`rgba(180,100,20,${.8*alive})`;ctx.fill();ctx.strokeStyle='#ffc84a';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,2,4,5,0,0,Math.PI*2);ctx.fillStyle='rgba(255,200,80,.7)';ctx.fill()
  } else if(e.type==='gunship'){
    ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(20,-8);ctx.lineTo(14,-16);ctx.lineTo(0,-10);ctx.lineTo(-14,-16);ctx.lineTo(-20,-8);ctx.closePath();
    ctx.fillStyle=`rgba(120,30,150,${.85*alive})`;ctx.fill();ctx.strokeStyle='#c07aff';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,2,5,7,0,0,Math.PI*2);ctx.fillStyle='rgba(200,120,255,.7)';ctx.fill();
    // cannons
    [-12,12].forEach(bx=>{ctx.fillStyle='#6a206a';ctx.fillRect(bx-3,10,6,8)})
  } else if(e.type==='hunter'){
    ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(16,-14);ctx.lineTo(8,-20);ctx.lineTo(0,-14);ctx.lineTo(-8,-20);ctx.lineTo(-16,-14);ctx.closePath();
    ctx.fillStyle=`rgba(150,20,20,${.9*alive})`;ctx.fill();ctx.strokeStyle='#ff4466';ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,2,5,8,0,0,Math.PI*2);ctx.fillStyle='rgba(255,100,120,.75)';ctx.fill();
    // glow aura
    ctx.globalAlpha=.18;const g=ctx.createRadialGradient(0,0,5,0,0,22);
    g.addColorStop(0,'rgba(255,50,80,.6)');g.addColorStop(1,'rgba(255,50,80,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill()
  }
  ctx.restore()
}

// ── PLAYER SHIP DRAW ──
function drawShip(sx,sy,alpha,accent,tilt,tAnim){
  ctx.save();ctx.translate(sx,sy);ctx.rotate(tilt);ctx.globalAlpha=alpha;
  const ac=accent||'#7ecbff';
  // engine glow
  const eg=ctx.createRadialGradient(0,22,0,0,22,32);
  eg.addColorStop(0,'rgba(255,160,40,.6)');eg.addColorStop(.4,'rgba(255,80,10,.22)');eg.addColorStop(1,'rgba(255,40,0,0)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(0,22,20,30,0,0,Math.PI*2);ctx.fill();
  // left wing
  ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(-28,24);ctx.lineTo(-22,30);ctx.lineTo(-11,18);ctx.lineTo(-6,20);ctx.closePath();
  ctx.fillStyle='#162240';ctx.fill();ctx.strokeStyle=ac;ctx.lineWidth=.9;ctx.stroke();
  ctx.globalAlpha=alpha*.45;ctx.strokeStyle=ac;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(-13,10);ctx.lineTo(-24,22);ctx.stroke();ctx.globalAlpha=alpha;
  // right wing
  ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(28,24);ctx.lineTo(22,30);ctx.lineTo(11,18);ctx.lineTo(6,20);ctx.closePath();
  ctx.fillStyle='#162240';ctx.fill();ctx.strokeStyle=ac;ctx.lineWidth=.9;ctx.stroke();
  ctx.globalAlpha=alpha*.45;ctx.beginPath();ctx.moveTo(13,10);ctx.lineTo(24,22);ctx.stroke();ctx.globalAlpha=alpha;
  // fuselage
  ctx.beginPath();ctx.moveTo(0,-26);ctx.bezierCurveTo(11,-19,13,2,11,20);ctx.lineTo(6,24);ctx.lineTo(-6,24);ctx.bezierCurveTo(-13,2,-11,-19,0,-26);ctx.closePath();
  const fg=ctx.createLinearGradient(-13,-26,13,24);fg.addColorStop(0,'#1e3e62');fg.addColorStop(.5,'#2c5282');fg.addColorStop(1,'#1a2e4a');
  ctx.fillStyle=fg;ctx.fill();ctx.strokeStyle=ac;ctx.lineWidth=1.1;ctx.stroke();
  // hull panel lines
  ctx.globalAlpha=alpha*.28;ctx.strokeStyle=ac;ctx.lineWidth=.55;
  [[-4,4,4,4],[-5,10,5,10],[-6,16,6,16]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()});
  ctx.globalAlpha=alpha;
  // center spine
  ctx.globalAlpha=alpha*.35;ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,22);ctx.stroke();ctx.globalAlpha=alpha;
  // cockpit
  ctx.beginPath();ctx.ellipse(0,-7,5.5,9,0,0,Math.PI*2);
  const cg=ctx.createRadialGradient(-2,-10,1,-1,-8,11);
  cg.addColorStop(0,'rgba(190,235,255,.92)');cg.addColorStop(.5,'rgba(110,195,255,.55)');cg.addColorStop(1,'rgba(30,85,170,.28)');
  ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='rgba(200,240,255,.65)';ctx.lineWidth=.85;ctx.stroke();
  ctx.beginPath();ctx.ellipse(-1.5,-11,1.8,2.8,Math.PI/5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.48)';ctx.fill();
  // engine pods
  [-13,13].forEach(ex=>{
    ctx.beginPath();ctx.ellipse(ex,15,3.8,6.5,0,0,Math.PI*2);ctx.fillStyle='#0c1c36';ctx.fill();ctx.strokeStyle=ac;ctx.lineWidth=.75;ctx.stroke();
    const fl=Math.sin(tAnim*2+ex)*.35+.75;
    ctx.beginPath();ctx.ellipse(ex,22,2.2,4.5*fl,0,0,Math.PI*2);
    const ef=ctx.createLinearGradient(ex,18,ex,28);ef.addColorStop(0,'rgba(255,220,80,.95)');ef.addColorStop(.5,'rgba(255,100,20,.65)');ef.addColorStop(1,'rgba(255,40,0,0)');
    ctx.fillStyle=ef;ctx.fill()
  });
  // nose glow
  ctx.beginPath();ctx.arc(0,-26,3.5,0,Math.PI*2);
  const ng=ctx.createRadialGradient(0,-26,0,0,-26,6);ng.addColorStop(0,'rgba(180,235,255,.95)');ng.addColorStop(1,'rgba(126,203,255,0)');
  ctx.fillStyle=ng;ctx.fill();
  ctx.restore()
}

function loop(ts){
  if(!lastTime)lastTime=ts;const dt=ts-lastTime;lastTime=ts;
  update(dt);draw();animId=requestAnimationFrame(loop)
}

// ── OVERLAY ──
async function endGame(){
  gameState='gameover';
  const save=loadSave();const prev=save[currentLevelDef.id]?.best||0;
  if(score>prev){save[currentLevelDef.id]={best:score};writeSave(save);document.getElementById('bestEl').textContent=score}
  let rankInfo=null;if(currentUser)rankInfo=await submitScore(currentLevelDef.id,score);
  showOverlay('gameover',rankInfo)
}
function showOverlay(type,rankInfo){
  const el=document.getElementById('gameOverlay');const title=document.getElementById('overlayTitle');
  const sub=document.getElementById('overlaySub');const scoreDiv=document.getElementById('overlayScore');
  const rankDiv=document.getElementById('overlayRank');const btns=document.getElementById('overlayBtns');
  el.classList.add('visible');
  if(type==='pause'){
    title.textContent='PAUSE';title.className='overlay-title';sub.textContent='';
    scoreDiv.style.display='none';rankDiv.style.display='none';
    btns.innerHTML=`<button class="menu-btn primary" onclick="resumeGame()">▶ Reprendre</button><button class="menu-btn" onclick="quitGame()">✕ Quitter</button>`
  } else {
    title.textContent='GAME OVER';title.className='overlay-title danger';
    sub.textContent='Niveau : '+currentLevelDef.name+' — Vague '+(waveIndex+1);
    scoreDiv.style.display='block';scoreDiv.textContent=score;
    rankDiv.style.display='block';
    if(rankInfo)rankDiv.innerHTML=`🏆 Classement : <span style="color:var(--gold);font-family:'Orbitron',sans-serif">#${rankInfo.rank}</span> sur ${rankInfo.total}`;
    else if(!currentUser)rankDiv.innerHTML=`<span style="color:var(--text2)">Connecte-toi pour le classement</span>`;
    else rankDiv.textContent='';
    btns.innerHTML=`<button class="menu-btn primary" onclick="initGame()">↺ Rejouer</button><button class="menu-btn" onclick="quitGame()">☰ Menu</button>`
  }
}
function hideOverlay(){document.getElementById('gameOverlay').classList.remove('visible')}
function resumeGame(){gameState='playing';hideOverlay()}
function quitGame(){if(animId)cancelAnimationFrame(animId);hideOverlay();buildLevelCards();showScreen('levelScreen')}

// ── INPUT ──
document.addEventListener('keydown',e=>{
  if(!keys)return;
  if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;
  if(e.code==='Space'){keys.fire=true;e.preventDefault()}
  if((e.code==='KeyP'||e.code==='Escape')&&gameState==='playing'){gameState='paused';showOverlay('pause')}
  else if((e.code==='KeyP'||e.code==='Escape')&&gameState==='paused')resumeGame()
});
document.addEventListener('keyup',e=>{
  if(!keys)return;
  if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='Space')keys.fire=false
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();for(let t of e.changedTouches){const x=t.clientX;if(x<W/3)touchLeft=true;else if(x>W*2/3)touchRight=true;else touchFire=true}},{passive:false});
canvas.addEventListener('touchend',()=>{touchLeft=touchRight=touchFire=false},{passive:false});
window.addEventListener('resize',()=>{if(document.getElementById('gameScreen').classList.contains('active'))resizeCanvas()});

// ── INIT ──
updateTitleUser();
</script>
